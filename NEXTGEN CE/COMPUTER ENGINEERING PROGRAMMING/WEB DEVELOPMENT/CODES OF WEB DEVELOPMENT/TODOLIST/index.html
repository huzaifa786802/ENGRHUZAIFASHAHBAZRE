<!-- OBJECTIVE -->
<!-- Build a To-Do List web app for managing daily tasks. -->
<!-- FEATURES -->
<!-- - Add new tasks -->
<!-- - Mark tasks as completed -->
<!-- - Delete or edit tasks -->
<!-- - Optionally store tasks in browser localStorage for persistence -->
<!-- TECH STACK -->
<!-- - HTML for structure -->
<!-- - CSS for layout and styles -->
<!-- - JavaScript for task logic and interaction -->
<!-- KEY CONCEPTS -->
<!-- - CRUD operations in JavaScript -->
<!-- - Event handling (click, submit) -->
<!-- - Local storage (optional) -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>To-Do List</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="container">
            <h1>To-Do List</h1>
            <form id="taskForm">
                <input type="text" id="taskInput" placeholder="Enter a new task" required>
                <button type="submit">Add Task</button>
            </form>
            <ul id="taskList"></ul>
            </div>
            <script src="script.js"></script>
    </body>
</html>
