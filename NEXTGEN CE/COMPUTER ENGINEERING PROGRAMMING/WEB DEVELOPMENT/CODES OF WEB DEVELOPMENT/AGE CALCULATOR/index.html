<!-- ========================================================= -->
<!-- OBJECTIVE -->
<!-- Create a web-based age calculator using JavaScript. -->
<!-- FEATURES -->
<!-- - User inputs Date of Birth (Day, Month, Year). -->
<!-- - System calculates and displays age in Years, Months, and Days. -->
<!-- TECH STACK -->
<!-- - HTML: Used for structuring the input form and layout. -->
<!-- - CSS: Used for styling and improving user interface. -->
<!-- - JavaScript: Used for age calculation using Date object. -->
<!-- KEY CONCEPTS -->
<!-- - DOM Manipulation -->
<!-- - Working with JavaScript Date & Time -->
<!-- - Input Validation -->
<!-- FILE -->
<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Age Calculator</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="calculator">
            <h2>Age Calculator</h2>
            <label for="day">Day:</label>
            <input type="number" id="day"  placeholder="DD">
            <label for="month">Month:</label>
            <input type="number" id="month" placeholder="MM">
            <label for="year">Year:</label>
            <input type="number" id="year" placeholder="YYYY">
            <button type="button" onclick="calculateAge()">Calculate Age</button>
            <div class="error"  id="error"></div>
            <div class="result" id="result">
            </div>
        </div>
        <!--Linking External JavaScript File -->
        <script src="script.js"></script>
    </body>
</html>
